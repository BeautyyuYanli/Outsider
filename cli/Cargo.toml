[package]
name = "outsider"
version = "0.1.0"
edition = "2024"
description = "End-to-end encrypted out-of-band secret handoff CLI"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "signal", "net", "time"] }
toml = "0.8"
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }
